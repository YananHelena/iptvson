name: Update IPTV and EPG

on:
  workflow_dispatch:
  schedule:
    # Türkiye UTC+3: 01:05 UTC = 04:05 Türkiye saati.
    - cron: "5 1 * * *"

permissions:
  contents: write

concurrency:
  group: iptv-epg-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run repository tests
        run: python tests.py

      - name: Build curated Turkish playlist
        run: python build_playlist.py --config channels.json

      - name: Checkout iptv-org EPG tools
        uses: actions/checkout@v7
        with:
          repository: iptv-org/epg
          ref: master
          path: _iptv_org_epg
          persist-credentials: false

      - name: Build per-source EPG channel lists
        run: |
          python build_epg_sources.py \
            --selected selected_channels.json \
            --config channels.json \
            --epg-root _iptv_org_epg \
            --output-dir epg_sources \
            --report epg_source_map.json

      - name: Setup Node.js for iptv-org EPG
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install iptv-org EPG dependencies
        working-directory: _iptv_org_epg
        env:
          HUSKY: "0"
        run: npm ci

      - name: Grab EPG candidates separately
        working-directory: _iptv_org_epg
        shell: bash
        run: |
          mkdir -p ../epg_candidates

          shopt -s nullglob
          files=(../epg_sources/*.channels.xml)

          if [ ${#files[@]} -eq 0 ]; then
            echo "Hiç EPG source channel dosyası oluşmadı."
            exit 1
          fi

          for file in "${files[@]}"; do
            base="$(basename "$file" .channels.xml)"
            echo "===== EPG source: $base ====="

            # One broken provider must not abort the other providers.
            npm run grab --- \
              --channels="$file" \
              --output="../epg_candidates/$base.xml" \
              --days=3 \
              --maxConnections=3 \
              --timeout=30000 \
              || echo "WARNING: $base grab failed; fallback sources will still be checked."
          done

      - name: Merge EPG using real programme coverage
        run: |
          python merge_epg.py \
            --selected selected_channels.json \
            --config channels.json \
            --candidate-dir epg_candidates \
            --output epg.new.xml \
            --report epg_coverage.new.json

      - name: Promote only a sufficiently complete EPG
        run: |
          python promote_epg.py \
            --candidate epg.new.xml \
            --coverage epg_coverage.new.json \
            --selected selected_channels.json \
            --config channels.json \
            --output epg.xml \
            --gzip-output epg.xml.gz \
            --final-coverage epg_coverage.json \
            --status epg_status.json

      - name: Validate playlist and EPG
        run: python validate_outputs.py

      - name: Remove temporary upstream/work files
        run: rm -rf _iptv_org_epg epg_sources epg_candidates

      - name: Commit updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            playlist.m3u \
            selected_channels.json \
            status.json \
            epg_source_map.json \
            epg_coverage.json \
            epg.xml \
            epg.xml.gz \
            epg_status.json

          if git diff --cached --quiet; then
            echo "IPTV/EPG çıktılarında değişiklik yok."
            exit 0
          fi

          git commit -m "chore: update IPTV playlist and EPG"
          git push
